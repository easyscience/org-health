name: Build and publish board

on:
  schedule:
    - cron: '17 */6 * * *' # every six hours
  workflow_dispatch:
  push:
    branches: [main]
  repository_dispatch:
    types: [refresh] # lets a tracked repo trigger a rebuild after its own CI

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # read workflow runs of the tracked repos

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install collector
        run: pip install -r requirements.txt

      - name: Cache clones of tracked repositories
        uses: actions/cache@v4
        with:
          path: .cache
          key: clones-${{ hashFiles('repos.yml') }}-${{ github.run_id }}
          restore-keys: clones-${{ hashFiles('repos.yml') }}-

      - name: Collect metrics
        env:
          GITHUB_TOKEN: ${{ secrets.ORG_HEALTH_TOKEN || github.token }}
          HISTORY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/history.json
        run: python collector/collect.py --config repos.yml --workdir .cache --out site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
